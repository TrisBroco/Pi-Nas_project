spring.application.name=NAS backend

#server.servlet.session.cookie.same-site=Lax
#server.servlet.session.cookie.secure=false


app.cookie-secure=false
app.sameSite=Lax

# Max file size
spring.servlet.multipart.max-file-size=200000MB
spring.servlet.multipart.max-request-size=200000MB

spring.profiles.active=${SPRING_PROFILE_ACTIVE}


# Disable Spring Boot DataSource autoconfiguration
#spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
#Use with caution. Create for testing and creating tables on the fly, but it will reset
## all tables that was changed. Ex: User authentication table will get deleted.
    #spring.jpa.hibernate.ddl-auto=create-drop

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Set base security logging to DEBUG
logging.level.org.springframework.security=DEBUG
# Set logging for JWT libraries to INFO or DEBUG to catch validation failures
logging.level.io.jsonwebtoken=DEBUG