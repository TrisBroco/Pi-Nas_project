<!DOCTYPE html>
<html lang="en">
<head>
    <title>File Upload</title>
</head>
<body style="background:#313538; color:white; font-family:Arial; padding:20px">

<h2>Upload Files</h2>

<form method="POST" action="http://localhost:8080/api/upload" enctype="multipart/form-data">

    <!-- USER FIELD -->
    <div style="margin-bottom:10px;">
        <label for="user">User:</label>
        <input type="text" id="user" name="user" placeholder="username" required />
    </div>

    <!-- FOLDER FIELD -->
    <div style="margin-bottom:10px;">
        <label for="folder">Folder (optional):</label>
        <input type="text" id="folder" name="folder" placeholder="subfolder/subfolder2" />
    </div>

    <!-- FILE FIELD -->
    <div style="margin-bottom:10px;">
        <label for="file">Choose files:</label>
        <input type="file" id="file" name="file" multiple />
    </div>

    <!-- SUBMIT BUTTON -->
    <div>
        <button type="submit">Upload Files</button>
    </div>

</form>
</body>
</html>
